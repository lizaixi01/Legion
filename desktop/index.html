<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Legion</title><link rel="stylesheet" href="style.css"></head>
<body><aside id="sidebar"><header><strong>Legion</strong><button id="collapse" class="icon" title="收起侧栏" aria-label="收起侧栏">◧</button></header><button id="search-toggle" class="nav" aria-expanded="false">⌕ <span>搜索</span><kbd>Ctrl K</kbd></button><input id="chat-search" type="search" placeholder="搜索对话" aria-label="搜索对话" hidden><button id="new-chat" class="nav"><span>↗</span> 新聊天</button><button id="agents-view" class="nav" aria-expanded="false">♧ <span>运行中的 Agent</span></button><div class="section">项目</div><button id="project" class="project" aria-expanded="true" aria-controls="chats"><span id="chevron"><svg  class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5"/></svg></span><svg  class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/></svg><span class="button-label">Legion</span></button><div id="chats"></div><div id="engineering-chats"></div><div class="sidebar-bottom"><button id="pool-button" hidden class="nav" aria-expanded="false">子 Agent 队列</button><button id="capacity-button" class="nav" aria-expanded="false">账户容量</button><button id="history" hidden class="nav" aria-expanded="false" aria-controls="details">◷ <span>运行记录</span></button></div></aside>
<main><header id="topbar"><button id="expand" class="icon" title="展开侧栏" hidden>◧</button><span id="title"></span><button id="details-toggle" class="icon" aria-label="运行详情" title="运行详情" hidden>◫</button></header><div id="conversation"><div id="welcome"><div class="mark">⌘</div><h1>我们应该在 Legion 中做些什么？</h1></div><div id="messages"></div></div><div id="composer-wrap"><div class="workspace"><button id="choose-project" type="button" title="选择项目以创建受管理的工程任务"><svg  class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/></svg><span id="project-label">选择工程项目</span></button><button id="clear-project" type="button" aria-label="返回普通聊天" hidden>×</button></div><form id="composer"><textarea id="prompt" placeholder="随心输入" aria-label="消息" rows="2"></textarea><div class="toolbar"><div class="controls"><button type="button" id="permission-button" class="setting" aria-haspopup="dialog" aria-expanded="false">项目内编辑</button><button type="button" id="agents-button" class="setting" aria-haspopup="dialog" aria-expanded="false">子 Agent</button></div><div class="tools"><button type="button" id="model-button" class="setting" aria-haspopup="dialog" aria-expanded="false"><span id="model-label">GPT-6 Sol · 高</span><svg  class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5"/></svg></button><button id="send" class="send" title="发送" aria-label="发送" type="submit">↑</button></div></div></form><div id="error" role="status"></div></div></main>
<aside id="details" hidden><header><strong id="panel-title">运行记录</strong></header><div id="records"></div><pre id="report"></pre></aside><div id="settings-popover" role="dialog" aria-label="执行设置" hidden></div><script type="module" src="app.js"></script></body></html>
