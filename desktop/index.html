<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Legion</title><link rel="stylesheet" href="style.css"></head>
<body><aside id="sidebar"><header><strong>Legion</strong><button id="collapse" class="icon" title="收起侧栏" aria-label="收起侧栏" aria-controls="sidebar" aria-expanded="true"></button></header><button id="search-toggle" class="nav" aria-expanded="false"><span id="search-icon" class="nav-icon"></span><span>搜索</span><kbd>Ctrl K</kbd></button><input id="chat-search" type="search" placeholder="搜索对话" aria-label="搜索对话" hidden><button id="new-chat" class="nav"><span id="new-chat-icon" class="nav-icon"></span><span>新聊天</span></button><button id="agents-view" class="nav" aria-expanded="false"><span id="running-icon" class="nav-icon"></span><span>运行中的 Agent</span></button><div id="sidebar-content"><div id="pinned-chats" aria-label="置顶对话"></div><div id="loose-chats" aria-label="未关联项目的对话"></div><div class="section">项目</div><div id="project-groups" aria-label="项目和对话"></div></div><div class="sidebar-bottom"><button id="pool-button" hidden class="nav" aria-expanded="false">子 Agent 队列</button><button id="capacity-button" class="nav" aria-expanded="false">账户容量</button><button id="history" hidden class="nav" aria-expanded="false" aria-controls="details">◷ <span>运行记录</span></button></div></aside>
<main><header id="topbar"><button id="expand" class="icon" title="展开侧栏" aria-label="展开侧栏" aria-controls="sidebar" aria-expanded="true" aria-hidden="true" tabindex="-1"></button><span id="title"></span><button id="details-toggle" class="icon" aria-label="运行详情" title="运行详情" hidden>◫</button></header><div id="conversation"><div id="welcome"><div class="mark">⌘</div><h1>我们应该在 Legion 中做些什么？</h1></div><div id="messages"></div></div><div id="composer-wrap"><div class="workspace"><button id="choose-project" type="button" title="选择项目作为对话上下文"><svg  class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/></svg><span id="project-label">选择项目</span></button><button id="clear-project" type="button" aria-label="取消选择项目" hidden>×</button></div><form id="composer"><div id="attachments" aria-label="附件"></div><textarea id="prompt" placeholder="随心输入" aria-label="消息" rows="2"></textarea><div class="toolbar"><div class="controls"><button type="button" id="attach-files" class="setting" title="添加文件" aria-label="添加文件"></button><button type="button" id="goal-mode" class="setting" aria-pressed="false" title="持续推进目标，直到完成或达到运行限额"><span id="goal-icon" class="setting-icon"></span><span>持续目标</span></button><button type="button" id="permission-button" class="setting" aria-haspopup="dialog" aria-expanded="false"><span id="permission-icon" class="setting-icon"></span><span id="permission-label">项目内编辑</span></button><button type="button" id="worker-button" class="setting" aria-haspopup="dialog" aria-expanded="false" title="执行模型与推理强度"><span id="worker-icon" class="setting-icon"></span><span>执行模型</span></button><button type="button" id="agents-button" class="setting" aria-haspopup="dialog" aria-expanded="false"><span id="agents-icon" class="setting-icon"></span><span id="agents-label">子 Agent · 自动</span></button></div><div class="tools"><button type="button" id="model-button" class="setting" aria-haspopup="dialog" aria-expanded="false"><span id="model-label">GPT-6 Sol · 高</span><svg  class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5"/></svg></button><button id="send" class="send" title="发送" aria-label="发送" type="submit" disabled></button></div></div></form><div id="error" role="status"></div></div></main>
<aside id="details" hidden><header><strong id="panel-title">运行记录</strong></header><div id="records"></div><pre id="report"></pre></aside><div id="chat-menu" role="menu" aria-label="对话操作" hidden></div><div id="settings-popover" role="dialog" aria-label="执行设置" hidden></div><script type="module" src="app.js"></script></body></html>
